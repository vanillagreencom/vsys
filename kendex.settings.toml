# Public kendex settings seeded from installed skill defaults.
# Skill scripts read this [env] table; process env and .env.local override it.
# Keep secrets, tokens, and personal overrides in .env.local.

[env]
# The team every Linear write targets. No default: an empty value refuses
# writes instead of guessing inside whatever workspace the API key reaches
# (the create actions still take `--team <name>` per call). Confirm with
# `linear.sh auth-check --strict`.
LINEAR_TEAM = "vsys"

# Issue identifier prefix used in examples (e.g. PROJ-123).
LINEAR_TEAM_PREFIX = "VSY"

# Agent-routing labels. `issues create` refuses a create that carries none of
# them, because agent routing never reaches such an issue. Each names an
# installed agent, except agent:multi, a container whose children span agents,
# and agent:human, work for a person. Empty turns the guard off.
LINEAR_AGENT_LABELS = "agent:frontend, agent:maintainer, agent:runtime, agent:rust, agent:researcher, agent:multi, agent:human"

# Non-empty makes `issues create` hold the presence half of the creation bar
# in the project-management skill's SKILL.md, § Disposition → **Name what
# reaches it**: it refuses a body with no `Reached by:` line, and a
# `--review-born --priority 2` body with no `Symptom:` line. What those lines
# say is the author's to judge. Creation is the chokepoint, since
# `Tracked: <ID>` needs only an issue to exist. Empty = guard off.
LINEAR_REQUIRE_REACH = "1"

# Reviewer merge gate policy, read by orch's approval-wait --resolve-mode
# through the review-gate skill's settings reader. "off" skips review
# requests and waits. "enforce" lets GitHub decide: the PR's base-branch
# rules and reviewDecision resolve the gate to approval or off (main's
# ruleset requires one approval). Any other value, or a missing review-gate
# settings reader, makes mode resolution exit 2.
REVIEW_GATE_MODE = "enforce"

# Organization refresh app, environment and credential names.
REVIEW_GATE_STANDARD_APP = "vanillagreen-fleet-lanes"
REVIEW_GATE_STANDARD_ENVIRONMENT = "kendex"
REVIEW_GATE_STANDARD_SECRETS = "FLEET_GH_APP_ID;FLEET_GH_APP_PRIVATE_KEY"

# Total review-wait budget in seconds before the on-timeout policy applies;
# an explicit max_wait argument always wins.
PR_REVIEW_WAIT_SECS = "900"

# Check-run or commit-status name a trusted review bot publishes on
# analyzed heads; a
# success counts as review-received. SECURITY: matched by NAME and anyone
# can publish under any name — name only the trusted bot's check. Empty =
# review objects only.
PR_REVIEW_CHECK = ""

# When the review signal never arrives: "block" reports a timeout;
# "proceed" records a reviewer-down override and moves on, but only with
# zero unresolved threads — a real comment is never bypassed. Comment-only
# bots can go silent on a trivial head, so a silent round proceeds rather
# than stalling the session.
PR_REVIEW_ON_TIMEOUT = "proceed"

# Command text the command-safety hook refuses before the shell runs, where
# the command-safety bundle is installed: a systemd-run invocation capped by
# MemoryMax= or MemoryHigh= with a K- or M-suffixed value. The danger is a cap
# measured in kilobytes or megabytes on a build: on 2026-09-06 such a starved
# cgroup failed a kernel allocation inside a btrfs transaction and the host's
# root volume went read-only. The workstation's agents.slice (112G) is not
# that cap: every lane runs inside it and must stay inside it. Remedy: run
# the reproduction as a plain process with its temp dir under the worktree's
# tmp/, still inside the slice.
COMMAND_SAFETY_DENY_PATTERN = "(^|[^[:alnum:]_-])systemd-run[[:space:]][^;|&]*Memory(Max|High)=[0-9]+[KkMm]([^[:alnum:]]|$)"

# Seconds ci-wait keeps polling before failing when no CI checks registered
# yet, four polls at its 180 s default interval; raise for approval-gated CI
# with slow dispatch.
CI_WAIT_NO_CHECKS_GRACE = "600"

# Max automated ci-fix rounds per PR before a human takes over.
CI_FIX_MAX_CYCLES = "6"

# Max internal re-review cycles per issue before the verdict pass; the
# re-review re-entry raises rereview_cycles and refuses at this, so the number
# set is the number of re-entries allowed.
REVIEW_MAX_CYCLES = "1"

# Max external review rounds on an open PR. At or past it a finding gets a
# disposition and no fix push, except a defect the diff introduces or arms.
REVIEW_MAX_EXTERNAL_ROUNDS = "4"

# Total concurrent agent-session budget, counting the primary; "0" =
# unlimited. Reviews run in waves when the reviewer set exceeds free slots.
# On the Codex runtime, set the cap `spawn-adapter slots` reports.
REVIEWER_SLOT_BUDGET = "0"

# Post-PR choices: "auto-recommended" continues within each budget; "ask" prompts.
ORCH_DECISION_MODE = "auto-recommended"

# "ask" presents the merge decision; "auto" merges once every gate is green.
# MERGE_READY = false never auto-merges.
ORCH_MERGE_AUTONOMY = "auto"
ORCH_LANE_OUTPUT = "quiet"

# Preserve the current report clock and runtime quiet window.
ORCH_OWNER_TIME_ZONE = "America/Los_Angeles"
ORCH_REPORT_QUIET_HOURS = "0-7"

# Path globs whose changes add the needs-ui-review QA signal.
QA_UI_PATHS = "src/ui/**"

# Design rules used by dev rounds and the needs-ui-review pass.
QA_UI_DESIGN_DOC = "docs/architecture/ui.md"

# Seconds per brief-delivery verification pass on tmux handoff lanes.
ORCH_TMUX_VERIFY_SECS = "15"
ORCH_LANE_SSH_PROMPT_SECS = "60"

# Max concurrent lanes the overseer keeps in flight.
ORCH_OVERSEER_LANES = "12"

# The models a new or successor overseer tries, in order, as
# harness:model:effort. A succession's walk then ends in the caller's own
# harness.
ORCH_OVERSEER_PREFERENCE = "claude:claude-opus-5-5:high,codex:gpt-6.1-sol:high"
ORCH_OVERSEER_HEADROOM_PCT = "5"
ORCH_OVERSEER_WALL_MINUTES = "20"
ORCH_HANDOFF_HEADROOM_PCT = "3"
ORCH_LANE_MAX_PCT = "95"

# Accounts whose cloud sessions can reach this repository: each pair records
# an approved repository card. The operator adds a pair after approving the
# card in a session of that account; a cloud-session pick keeps no other
# account.
ORCH_LANE_CLOUD_REPOS = "2claude=vanillagreencom/vsys,3claude=vanillagreencom/vsys,4claude=vanillagreencom/vsys"

# Execute the audit's accepted creations and cancellations without a question.
PM_CREATE_AUTONOMY = "auto"

# Priority-ordered roster, space/comma separated. Per entry:
# SECOND_OPINION_<NAME>_CMD (claude and codex have defaults) and
# SECOND_OPINION_<NAME>_MODEL (identity, when the CLI fronts another model).
SECOND_OPINION_MODELS = "claude codex"

# Opinions a review collects; 2+ unions distinct models on one diff.
SECOND_OPINION_COUNT = "1"

# Roster commands (identities claude / codex).
SECOND_OPINION_CLAUDE_CMD = "claude -p --no-session-persistence --model opus --effort max --allowedTools Bash(read-only:true),Read,Glob,Grep --restricted --permission-mode dontAsk --tools Bash,Read,Glob,Grep"

SECOND_OPINION_CODEX_CMD = "codex exec -m gpt-6.1-sol -s read-only -c model_reasoning_effort=xhigh --ephemeral --disable hooks"

# Seconds to wait for the external CLI.
SECOND_OPINION_TIMEOUT = "1080"

# Home for review/audit records written without --output; a directory the
# script CREATES is seeded with a "*" .gitignore (a pre-existing one is
# left alone — ignore it yourself).
SECOND_OPINION_ARTIFACT_DIR = "tmp/second-opinion"

# Repo instruction files appended to the review prompt (repo-rule lens).
# Empty disables.
SECOND_OPINION_REVIEW_INSTRUCTIONS = "AGENTS.md .github/instructions/*.instructions.md .github/copilot-instructions.md"

# ── Skill settings ───────────────────────────────────────────────────────
# What the installed skills read for repo-specific names, paths and commands.

# Commit identity for agent-authored work. Empty uses the ambient git identity.
BOT_EMAIL = ""
BOT_NAME = ""
BOT_REMOTE_NAME = ""

# Where the decider skill keeps architecture decision records.
DECISIONS_DIR = "docs/decisions"

# Full validation runs at development completion. Submit reuses that result
# for the same commit; CI runs the full suites independently. scripts/ci.py
# holds the Python suites and the dependency, lint, type, test and build
# checks.
DEV_VALIDATE_CMD = "python3 scripts/ci.py && .agents/skills/bot-instructions/scripts/bot-instructions check"

# Queue-only paths beside the shipped list, which already names
# .github/workflows/*, this file and the harness-ci scripts: a change to one
# runs in the merge queue before it lands. Blank-separated globs, where `*`
# also matches `/`. A path belongs here when it falls in one of four
# categories, listed in this order:
#   1. the CI contract and the checkers it runs: scripts/ci.py, the package
#      check, the refusal module both import, the build, the sample check,
#      and the bench scripts the checks run with their helper;
#   2. the toolchain and its configuration;
#   3. shared test helpers that every suite of a tree loads;
#   4. checkers a workflow runs out of the pull request's own tree.
# A test file stays off the list: it is judged with the code it tests, as
# the shipped list queues a test harness's shared library and not the tests
# it runs. Use a glob where a category is a whole directory or file family.
HARNESS_CI_QUEUE_PATHS = "scripts/ci.py scripts/package_file_list_check.py scripts/refusal.py scripts/build.ts scripts/sample-check.ts scripts/bench-*.ts scripts/percentile.ts package.json bun.lock .bun-version biome.json tsconfig.json bunfig.toml src/test/* warden/agent_warden_testlib.py .agents/skills/bot-instructions/scripts/* kendex.toml kendex.settings.toml"

# Test files outside the built-in test rule, counted as test lines rather
# than production by the branch size and change-class measurements: the
# Python suites and the warden's shared test library. `*` also matches `/`.
ORCH_SIZE_TEST_PATHS = "warden/*_test.py warden/agent_warden_testlib.py scripts/*_test.py"

# The repo-root executable the guard chain runs last, after doc-limits,
# preflight, the bot-instructions check and the commit-guards batch. This
# repository has no guard of its own; the full checks run through
# DEV_VALIDATE_CMD.
COMMIT_GUARDS_PRE_COMMIT_LOCAL = ""

# The fragment scope of the changelog-entries lane. The two-segment glob
# keeps changelog.d/README.md out — its bullets document the format and are
# not entries. CHANGELOG.md is the lane's other scope,
# COMMIT_GUARDS_CHANGELOG_RECORD, judged by a different rule: entries there
# are the collator's, so only lines this commit ADDS under [Unreleased] are
# refused and the released history no one may rewrite is never measured.
COMMIT_GUARDS_CHANGELOG_PATHS = "changelog.d/*/*.md"

# Paths whose change obliges a changelog entry, checked by the commit-msg
# lane. These are the paths a release ships: the application, its build and
# release scripts, the packaging recipes and the installer.
COMMIT_GUARDS_CHANGELOG_REQUIRED_PATHS = "src/* scripts/* packaging/* install.sh"

# The app's version file, beside the record. The changelog-entries lane
# judges each version increase in it by the commit-guards release-version
# rule (.agents/skills/commit-guards/CHECKS.md § Release versions).
COMMIT_GUARDS_CHANGELOG_VERSION_PATHS = "package.json"

# The markdown lanes judge every tracked markdown file, not only the files a
# commit touches.
COMMIT_GUARDS_MD_SCOPE = "all"

GH_BOT_USERNAME = ""
GH_VERIFY_CMD = ""

# Branch names match Linear issue identifiers case-insensitively. GitHub
# issues are deliberately absent because a PR's Closes line identifies them.
GH_ISSUE_PATTERN = "vsy-[0-9]+"

LINEAR_FORMAT = "safe"
ORCH_STATE_DIR = "tmp"
ORCH_USER_MODE = "ceo"

# ── Worktrees ────────────────────────────────────────────────────────────
# What a fresh issue worktree gets from this checkout: only paths git does
# not carry. An entry does nothing when git carries every path under it, and
# links the untracked children when it does not. The harness trees are
# committed whole, so a worktree gets them from its own branch.
WORKTREE_BASE_DIR = "~/dev-data/.worktrees/vsys"
WORKTREE_COPIES = ".kendex-lock.json"
WORKTREE_DEFAULT_BRANCH = "main"
WORKTREE_MKDIRS = "tmp"
# node_modules: scripts/ci.py and the package scripts run the pinned Bun,
# biome and tsc from this store. The link shares the main checkout's real
# install (bun — bun.lock), so a dependency change is made with the branch
# checked out in the MAIN checkout, where `bun install` rebuilds the store,
# never in a linked worktree, whose install would write through the link.
# .gitignore's `node_modules/` pattern covers the symlink.
WORKTREE_SYMLINKS = ".env.local node_modules"

# Nothing needs one: the CLAUDE.md shims kendex writes beside each AGENTS.md
# are tracked files, so they arrive through git, and naming one here would
# shadow tracked content.
WORKTREE_RELATIVE_SYMLINKS = ""

# Seconds a 1Password token resolution may take.
KENDEX_GITHUB_OP_TIMEOUT = "10"

# Seconds the `gh` auth preflight may take.
KENDEX_GITHUB_AUTH_TIMEOUT = "10"

# Seconds a single `pr-view` read may take.
KENDEX_GITHUB_PR_VIEW_TIMEOUT = "30"

# Path to the worktree CLI `open-terminal` drives. Empty resolves the
# installed worktree skill's `scripts/worktree`; a value that is not
# executable stops the launch with that path named.
WORKTREE_CLI = ""
