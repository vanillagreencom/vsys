[bot-instructions]
schema = 1

[bot-instructions.repo]
name = "vsys"
tracker = "VSY"
summary = "vsys is a Linux terminal dashboard for agent processes and system health. It uses Bun, TypeScript, and OpenTUI. It reads system information without changing processes or system settings. The repository currently contains the application plan and development tools."

[bot-instructions.bots]
codex = true
copilot = true
coderabbit = false
qodo = false
qodo_best_practices = false
qodo_review_md = false
macroscope = false

[bot-instructions.exclusions]
derive_render = false

[[bot-instructions.exclusions.path]]
glob = ".agents/skills/**"
reason = "Generated from vanillagreencom/kendex; fix the upstream package and refresh."

