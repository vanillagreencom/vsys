# vsys scrub reporter: the directory vsys-scrub-report writes its reports to.
# /var/lib persists across a reboot, so a report a scrub wrote before a
# reboot still answers after it; this line only creates the directory on a
# fresh install and fixes its mode, and never empties one that already
# holds reports. Its absence still tells vsys an installed reporter has not
# run yet from no reporter at all.
d /var/lib/btrfs-scrub 0755 root root -
