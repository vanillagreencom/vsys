# vsys scrub reporter: after every scrub, write the report vsys reads into
# /run/btrfs-scrub, the directory vsys-scrub.conf creates and vsys's scrubDir
# names. ExecStopPost runs however the scrub ended, so a scrub that stopped
# early still leaves a report saying so.
[Service]
ExecStopPost=/usr/local/bin/vsys-scrub-report %f /run/btrfs-scrub
