name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, as v<version>"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    name: Draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check the tag shape
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag must look like v<version>, got '$TAG'"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "See CHANGELOG.md for the entries in this release."
          fi

  reporter:
    name: Checksum the root-side reporters
    needs: create
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Checksum the scrub reporter files
        run: |
          cd scripts/scrub-reporter
          sha256sum vsys-scrub-report vsys-report.conf vsys-scrub.conf > scrub-reporter.sha256
          cat scrub-reporter.sha256
      - name: Checksum the smart reporter files
        run: |
          cd scripts/smart-reporter
          sha256sum vsys-smart-report vsys-smart-report.service vsys-smart-report.timer vsys-smart.conf > smart-reporter.sha256
          cat smart-reporter.sha256
      - name: Upload the checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" scripts/scrub-reporter/scrub-reporter.sha256 scripts/smart-reporter/smart-reporter.sha256 --clobber

  build:
    name: Build ${{ matrix.arch }}
    needs: create
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Check that package.json matches the tag
        run: |
          want="${TAG#v}"
          have=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $TAG expects package.json version $want, found $have"
            exit 1
          fi
      - name: Build the standalone binary
        run: |
          bun install --frozen-lockfile
          bun run compile
          ./vsys --help >/dev/null
          bun scripts/sample-check.ts ./vsys
      - name: Pack the archive
        run: |
          asset="vsys-${TAG}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p stage
          cp vsys LICENSE README.md stage/
          packaging/stage-runtime-files.sh stage
          tar -czf "$asset" -C stage vsys LICENSE README.md lib
          sha256sum "$asset" > "${asset}.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber

  publish:
    name: Publish the release
    needs: [build, reporter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Combine the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sums && cd sums
          gh release download "$TAG" --pattern '*.sha256' --dir .
          cat ./*.sha256 | sort -k2 > ../SHA256SUMS
          cd .. && cat SHA256SUMS
          expected=$(printf '%s\n' \
            "vsys-${TAG}-linux-aarch64.tar.gz" \
            "vsys-${TAG}-linux-x86_64.tar.gz" \
            vsys-report.conf \
            vsys-scrub-report \
            vsys-scrub.conf \
            vsys-smart-report \
            vsys-smart-report.service \
            vsys-smart-report.timer \
            vsys-smart.conf | sort)
          actual=$(awk '{print $2}' SHA256SUMS | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::SHA256SUMS names [$(tr '\n' ' ' <<<"$actual")] but expected [$(tr '\n' ' ' <<<"$expected")]"
            exit 1
          fi
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest

  aur:
    name: Update the AUR package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      # Before the checkout: without git in the container, actions/checkout
      # falls back to a source tarball with no .git.
      - name: Install the packaging tools
        run: pacman -Sy --noconfirm --needed git openssh curl pacman-contrib
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Publish vsys to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: packaging/publish-aur.sh vsys "${TAG#v}"
