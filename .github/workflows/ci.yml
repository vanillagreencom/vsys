name: CI

# push and workflow_dispatch stay beside the two events the CI context is
# required on. The classifier answers false on workflow_dispatch, so a manual
# run runs every job.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR updates cancel superseded runs; other events keep unique groups.
# .agents/skills/harness-ci/references/wiring.md § The CI template.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # kendex's change-class action classifies the diff:
  # .agents/skills/harness-ci/references/wiring.md § Through the composite action.
  changes:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `actions: read` is what the action reads this workflow's earlier runs
    # with, to stand down the lanes a passing run of the same tree already
    # ran: .agents/skills/harness-ci/references/wiring.md § Proof reuse.
    permissions:
      contents: read
      actions: read
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      # Whether the lanes run at all, as the action answered it: what every
      # lane condition and CI's waiver read. The classify step's `lanes:`
      # log line says why.
      lanes: ${{ steps.classify.outputs.lanes }}
      # One output per lane .github/ci-lanes.conf declares, its verdict as
      # the action answered it. The classify step's `lane:` log lines say
      # why.
      lane_application: ${{ steps.lanes.outputs.lane_application }}
      lane_package: ${{ steps.lanes.outputs.lane_package }}
      # Whether the diff changes README.md, which arch-package installs.
      package_readme: ${{ steps.lanes.outputs.package_readme }}
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
    steps:
      - name: The classifier, from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: classifier
          persist-credentials: false
      - name: The tree under judgement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - id: render-reach
        continue-on-error: true
        run: >-
          classifier/.agents/skills/harness-ci/scripts/harness-only
          --mode render-candidate --repo subject --event "$EVENT" --base "$BASE" --head "$HEAD"
      - id: kendex
        if: steps.render-reach.outputs.render_candidate == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ${{ github.token }}
        run: classifier/.agents/skills/review-gate/scripts/install-latest.sh
      - id: mirror
        if: steps.render-reach.outputs.render_candidate == 'true'
        continue-on-error: true
        run: kendex source refresh
        working-directory: subject
      - name: Report unavailable render prerequisites
        if: steps.render-reach.outputs.render_candidate == 'true' && (steps.kendex.outcome != 'success' || steps.mirror.outcome != 'success')
        env:
          KENDEX_OUTCOME: ${{ steps.kendex.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: >-
          echo "::warning title=render proof may be unavailable::kendex install $KENDEX_OUTCOME, source refresh $MIRROR_OUTCOME"
      - id: classify
        uses: vanillagreencom/kendex/.github/actions/change-class@main
        env:
          ORCH_SIZE_RENDER_ROOTS: .agents .claude .codex .pi
          # ORCH_SIZE_TEST_PATHS: <globs>
          # Test globs outside orch's defaults belong in the default branch's
          # kendex.settings.toml, which a lane's own classifier run reads too.
        with:
          repo: subject
          # The lane declaration is the default branch's: the pull request's
          # own copy could stand its lanes down.
          lanes-from: classifier
          # covers-all-lanes stays unset: the package lane is not event-uniform.
          event: ${{ env.EVENT }}
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
      # A composite action publishes only the outputs it declares, so the
      # verdicts arrive as one `lane_<name>=true|false` line per lane and are
      # published here as step outputs, one per lane, beside package_readme.
      - id: lanes
        env:
          LANE_VERDICTS: ${{ steps.classify.outputs.lane_verdicts }}
          CHANGED_PATHS: ${{ steps.classify.outputs.changed_paths }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LANE_VERDICTS" >>"$GITHUB_OUTPUT"
          case $'\n'"$CHANGED_PATHS"$'\n' in
            *$'\n'README.md$'\n'*) readme=true ;;
            *) readme=false ;;
          esac
          printf 'package_readme=%s\n' "$readme" | tee -a "$GITHUB_OUTPUT"

  application:
    name: Bun (lint, types, tests, build)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.lanes != 'false' && needs.changes.outputs.lane_application != 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Check the application
        run: python3 scripts/ci.py

  # The package installs README.md, so a docs-only diff that changes it runs
  # this lane; a render refresh or any other docs-only diff does not.
  arch-package:
    name: Arch package warden status
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.lanes != 'false' && needs.changes.outputs.lane_package != 'false') || needs.changes.outputs.package_readme == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Install the packaging tools
        run: pacman -Sy --noconfirm --needed git bun python systemd-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the local vsys-git package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -euo pipefail <<'BUILD'
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/arch-package
          cp packaging/vsys-git/PKGBUILD build/arch-package/PKGBUILD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path("build/arch-package/PKGBUILD")
          text = path.read_text()
          old = 'source=("${pkgname}::git+${url}.git")'
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          pkg_var = "$" + "{pkgname}"
          new = f'source=("{pkg_var}::git+file://{Path.cwd()}#commit={commit}")'
          if text.count(old) != 1:
              raise SystemExit("source line not found")
          updated = text.replace(old, new)
          if new not in updated:
              raise SystemExit("source rewrite failed")
          path.write_text(updated)
          PY
          cd build/arch-package
          makepkg --noconfirm
          BUILD
      - name: Install the package and check the warden path
        run: |
          pacman -U --noconfirm build/arch-package/vsys-git-*.pkg.tar.zst
          mkdir -p build/arch-home/.config build/arch-home/.local/share build/arch-runtime
          set +e
          output=$(HOME="$GITHUB_WORKSPACE/build/arch-home" \
            XDG_CONFIG_HOME="$GITHUB_WORKSPACE/build/arch-home/.config" \
            XDG_DATA_HOME="$GITHUB_WORKSPACE/build/arch-home/.local/share" \
            XDG_RUNTIME_DIR="$GITHUB_WORKSPACE/build/arch-runtime" \
            vsys warden status 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          printf 'vsys warden status exit=%s\n' "$status"
          case "$output" in
            *"installer not found"*) exit 1 ;;
            *"file agent-warden.service:"*) ;;
            *) exit 1 ;;
          esac
          python3 scripts/package_file_list_check.py --installed-root /

  # Runs on every change: it takes seconds, and its inputs include the
  # markdown instruction files a docs-only diff changes.
  bot-instructions:
    name: Bot instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check the generated review instructions
        run: |
          result=0
          diff -qr trusted/.agents/skills/bot-instructions candidate/.agents/skills/bot-instructions || result=$?
          case "$result" in
            0) checker=trusted/.agents/skills/bot-instructions/scripts/bot-instructions ;;
            1)
              echo "::warning::The review package differs between the default branch and candidate; validating with the candidate package. This policy change needs human review."
              checker=candidate/.agents/skills/bot-instructions/scripts/bot-instructions
              ;;
            *) echo "::error::Could not compare review packages"; exit "$result" ;;
          esac
          "$checker" check --repo candidate --spec candidate/.agents/skills/bot-instructions

  ci:
    name: CI
    # The aggregate the main ruleset is to require in place of the per-job
    # checks. It fails when the classifier, or any other needed job, fails or
    # is cancelled, and when a job skips that neither the `lanes` waiver nor
    # its own lane verdict from the changes job stood down. application and
    # arch-package are the only jobs either may stand down, and arch-package
    # only when the diff leaves README.md alone.
    needs: [changes, application, arch-package, bot-instructions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: This workflow, from the tree under judgement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The aggregate helper, from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: classifier
          sparse-checkout: .agents/skills/harness-ci/scripts
          persist-credentials: false
      # Kept beside aggregate-needs: that helper reads only the results it is
      # handed, so it cannot see a job missing from needs.
      - name: Require every other job in needs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jobs=$(yq -o=json '.jobs | keys | map(select(. != "ci")) | sort' subject/.github/workflows/ci.yml | jq -c .)
          needed=$(jq -c 'keys | sort' <<<"$NEEDS")
          if [ "$jobs" != "$needed" ]; then
            echo "::error::CI needs $needed but the workflow's other jobs are $jobs"
            exit 1
          fi
      - name: Require every needed job to succeed or to skip on its verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          WAIVER: ${{ needs.changes.outputs.lanes == 'false' }}
          PACKAGE_README: ${{ needs.changes.outputs.package_readme == 'true' }}
        run: |
          set -euo pipefail
          package=(--skippable arch-package --lane arch-package=package)
          # A README.md change runs arch-package whatever the verdicts say.
          if [ "$PACKAGE_README" = true ]; then package=(); fi
          classifier/.agents/skills/harness-ci/scripts/aggregate-needs \
            --results "$NEEDS" --classifier changes \
            --waiver "$WAIVER" --skippable application \
            --lane application=application "${package[@]}"
