name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Bun (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Test CI failure handling
        run: python3 -m unittest discover -s scripts -p '*_test.py' -v
      - name: Check the application
        run: python3 scripts/ci.py

  arch-package:
    name: Arch package warden status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Install the packaging tools
        run: pacman -Sy --noconfirm --needed git bun python systemd-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the local vsys-git package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -euo pipefail <<'BUILD'
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/arch-package
          cp packaging/vsys-git/PKGBUILD build/arch-package/PKGBUILD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path("build/arch-package/PKGBUILD")
          text = path.read_text()
          old = 'source=("${pkgname}::git+${url}.git")'
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          pkg_var = "$" + "{pkgname}"
          new = f'source=("{pkg_var}::git+file://{Path.cwd()}#commit={commit}")'
          if text.count(old) != 1:
              raise SystemExit("source line not found")
          updated = text.replace(old, new)
          if new not in updated:
              raise SystemExit("source rewrite failed")
          path.write_text(updated)
          PY
          cd build/arch-package
          makepkg --noconfirm
          BUILD
      - name: Install the package and check the warden path
        run: |
          pacman -U --noconfirm build/arch-package/vsys-git-*.pkg.tar.zst
          mkdir -p build/arch-home/.config build/arch-home/.local/share build/arch-runtime
          set +e
          output=$(HOME="$GITHUB_WORKSPACE/build/arch-home" \
            XDG_CONFIG_HOME="$GITHUB_WORKSPACE/build/arch-home/.config" \
            XDG_DATA_HOME="$GITHUB_WORKSPACE/build/arch-home/.local/share" \
            XDG_RUNTIME_DIR="$GITHUB_WORKSPACE/build/arch-runtime" \
            vsys warden status 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          printf 'vsys warden status exit=%s\n' "$status"
          case "$output" in
            *"installer not found"*) exit 1 ;;
            *"file agent-warden.service:"*) ;;
            *) exit 1 ;;
          esac
          python3 scripts/package_file_list_check.py --installed-root /

  review-gate-validate:
    name: Review gate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .agents/skills/review-gate/scripts/validate.sh

  bot-instructions:
    name: Bot instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check the generated review instructions
        run: |
          result=0
          diff -qr trusted/.agents/skills/bot-instructions candidate/.agents/skills/bot-instructions || result=$?
          case "$result" in
            0) checker=trusted/.agents/skills/bot-instructions/scripts/bot-instructions ;;
            1)
              echo "::warning::The review package differs between the default branch and candidate; validating with the candidate package. This policy change needs human review."
              checker=candidate/.agents/skills/bot-instructions/scripts/bot-instructions
              ;;
            *) echo "::error::Could not compare review packages"; exit "$result" ;;
          esac
          "$checker" check --repo candidate --spec candidate/.agents/skills/bot-instructions

  ci:
    name: CI
    # Fails when any job in its needs list does not succeed. It is the
    # aggregate the main ruleset is to require in place of the per-job checks.
    # scripts/package_file_list_check.py fails when needs differs from the
    # other job ids in this file, so every job above stays in the list.
    # No job here is skipped by a change-classifier rule, so no skip is
    # expected and a skipped, failed or cancelled job fails this one.
    needs: [application, arch-package, review-gate-validate, bot-instructions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key) finished \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then printf '%s\n' "$failed"; exit 1; fi
