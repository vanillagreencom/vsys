name: CodeQL

# Advanced setup in place of code-scanning default setup, which has no path
# filter. The languages and the query suite (the default one) are the ones
# default setup analysed.
#
# Push and pull_request scan code, dependencies and workflows. Settings and
# kendex renders alone skip unless they change a workflow; the weekly scan
# keeps the default branch's results current. CodeQL is not a required check
# (the required context is CI alone), so a skipped run leaves nothing
# unreported. No merge_group trigger, so the queue never waits on it.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "warden/**"
      - ".github/workflows/**"
      - package.json
      - bun.lock
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "warden/**"
      - ".github/workflows/**"
      - package.json
      - bun.lock
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

# Each action from outside vanillagreencom is pinned to a commit SHA: its
# owner can move a tag to other code, but a SHA names one fixed tree.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # None of the three languages needs a build to be analysed.
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
