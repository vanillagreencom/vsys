name: CodeQL

# Advanced setup in place of code-scanning default setup, which has no path
# filter. The languages and the query suite (the default one) are the ones
# default setup analysed.
#
# Only pull_request skips a diff of Markdown or settings alone: push to main
# and the weekly schedule keep the default branch's results whole. CodeQL is
# not a required check (the required context is CI alone), so a skipped run
# leaves nothing unreported. No merge_group trigger, so the queue never waits
# on it.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
      - kendex.settings.toml
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

# Each action from outside vanillagreencom is pinned to a commit SHA: its
# owner can move a tag to other code, but a SHA names one fixed tree.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # None of the three languages needs a build to be analysed.
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
