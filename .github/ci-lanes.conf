# Keep inputs of commands the shared workflow reader cannot follow.
application .bun-version .gitignore bun.lock bunfig.toml biome.json src/* scripts/* warden/* # reason: setup-bun reads .bun-version, and scripts/ci.py runs Bun lint, tests and builds and discovers Python suites in the checkout.
application .github/workflows/release.yml .github/workflows/aur-git.yml data/* packaging/* install.sh # reason: scripts/ci.py runs the Python check of package recipes, runtime files, release workflows and the installer.
workflow scripts/ci_workflow_test.py kendex.toml # reason: the Python workflow test drives harness-only and aggregate-needs, and harness-only reads kendex.toml for a manifest schema change.
workflow .agents/skills/orch/scripts/lib/kendex-env.sh .agents/skills/change-scope/scripts/lib/branch-growth.sh # reason: the workflow test covers classifier wiring, which uses shell settings and branch measurement libraries.
package bun.lock bunfig.toml src/* data/* scripts/build.ts scripts/jsx-dev-runtime.ts LICENSE README.md # reason: the Arch makepkg recipe runs Bun compile and stages runtime files and package documentation.
package .github/workflows/release.yml .github/workflows/aur-git.yml scripts/package_file_list_check.py scripts/refusal.py install.sh packaging/* scripts/scrub-reporter/* scripts/smart-reporter/* warden/install warden/agent-warden warden/agent-confine* warden/vsys-pressure-record warden/systemd/* # reason: the Arch recipe stages these runtime files and its Python package check reads the recipes, release workflows, installer and staged files.
