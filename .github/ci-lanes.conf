# <lane>[:queue][:nightly] <glob>...; `#` starts a comment.
# application: the ci.yml job that runs python3 scripts/ci.py. scripts/ci_workflow_test.py runs this checkout's harness-ci scripts.
application .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/aur-git.yml .bun-version .gitattributes .gitignore
application package.json bun.lock bunfig.toml tsconfig.json biome.json src/* scripts/* warden/* data/* packaging/* install.sh
application .agents/skills/harness-ci/* .agents/skills/orch/scripts/lib/* .agents/skills/orch/references/narrow-change.conf
# package: the arch-package job, which builds packaging/vsys-git/PKGBUILD, runs vsys warden status and scripts/package_file_list_check.py.
package .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/aur-git.yml .gitattributes package.json bun.lock bunfig.toml tsconfig.json
package src/* data/* scripts/build.ts scripts/jsx-dev-runtime.ts scripts/package_file_list_check.py scripts/refusal.py LICENSE README.md install.sh
package packaging/* scripts/scrub-reporter/* scripts/smart-reporter/* warden/install warden/agent-warden warden/agent-confine* warden/systemd/*
