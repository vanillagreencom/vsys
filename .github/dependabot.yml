version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One weekly pull request for every action update. It also keeps CodeQL's
    # init and analyze actions together, which CodeQL requires.
    groups:
      github-actions:
        patterns:
          - "*"
    # kendex-refresh.yml is a kendex render: only the kendex refresh route moves its kendex refs.
    ignore:
      - dependency-name: "vanillagreencom/kendex*"
