# vsys scrub reporter, as the vsys package installs it: after every scrub,
# write the report vsys reads into /var/lib/btrfs-scrub, the directory the
# packaged vsys-scrub.conf creates and vsys's scrubDir names. It shares its
# name with the drop-in scripts/scrub-reporter/install writes under /etc, so
# a host that ran that installer first runs one reporter, not two.
[Service]
ExecStopPost=/usr/lib/vsys/scripts/scrub-reporter/vsys-scrub-report %f /var/lib/btrfs-scrub
